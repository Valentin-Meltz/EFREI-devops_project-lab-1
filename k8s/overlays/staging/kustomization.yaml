apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
labels:
  - pairs:
      env: staging
    includeSelectors: false
    includeTemplates: true
replicas:
  - name: myapp
    count: 3
configMapGenerator:
  - name: myapp-config
    literals:
      - APP_ENV=staging
images:
  - name: ghcr.io/valentin-meltz/efrei-devops_project-lab-1
    newTag: ba33ff148f57ad68f209a683faeb358a1389c4df
