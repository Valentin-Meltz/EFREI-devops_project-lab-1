name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t myapp:${{ github.sha }} .
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # kubectl (with its bundled Kustomize) is preinstalled on ubuntu-latest
      - name: Render overlays and check invariants
        run: |
          pip install PyYAML==6.0.2
          python scripts/validate_manifests.py
  publish:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Multi-architecture image: amd64 for cloud runners/servers, arm64 for
      # Apple Silicon kind clusters (an amd64-only image fails there with
      # "no match for platform in manifest").
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
